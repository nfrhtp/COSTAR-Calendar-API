# COSTAR Calendar API — Cloudflare Worker configuration.
# Deployed by .github/workflows/deploy.yml (wrangler deploy).
# The public/ directory is generated by build/build_api_data.py — never edited by hand.

name = "costar-calendar-api"
main = "worker/index.js"
compatibility_date = "2026-07-01"
workers_dev = true

routes = [
  { pattern = "api.costar.date", custom_domain = true }
]

[assets]
directory = "public"
binding = "ASSETS"
